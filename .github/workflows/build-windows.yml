name: Windows Build (MSVC)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: build-msvc/_deps
          key: juce-7.0.9-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            juce-7.0.9-

      - name: Configure (Visual Studio 17 2022, x64)
        run: |
          cmake -S . -B build-msvc ^
                -G "Visual Studio 17 2022" -A x64 ^
                -DCMAKE_BUILD_TYPE=Release
        shell: cmd

      - name: Build VST3
        run: |
          cmake --build build-msvc ^
                --target TekkMojoVST_VST3 ^
                --config Release ^
                --parallel
        shell: cmd

      - name: Build Standalone
        run: |
          cmake --build build-msvc ^
                --target TekkMojoVST_Standalone ^
                --config Release ^
                --parallel
        shell: cmd

      - name: Build DSP primitives test
        run: |
          cmake --build build-msvc ^
                --target dsp_primitives_test ^
                --config Release ^
                --parallel
        shell: cmd

      - name: Run DSP primitives test
        run: build-msvc\Release\dsp_primitives_test.exe
        shell: cmd

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TekkMojo-VST3-Windows
          path: build-msvc/TekkMojoVST_artefacts/Release/VST3/

      - name: Upload Standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: TekkMojo-Standalone-Windows
          path: build-msvc/TekkMojoVST_artefacts/Release/Standalone/
